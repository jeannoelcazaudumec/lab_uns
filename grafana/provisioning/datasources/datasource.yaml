apiVersion: 1

datasources:
  - name: TimescaleDB
    uid: timescaledb
    type: postgres
    access: proxy
    url: timescaledb:5432
    user: postgres
    secureJsonData:
      password: postgres
    jsonData:
      database: telemetry
      sslmode: disable
      maxOpenConns: 10
      maxIdleConns: 2
      connMaxLifetime: 14400
      postgresVersion: 1500
      timescaledb: true
    isDefault: true
    editable: true

  - name: Mosquitto UNS
    uid: mosquitto-uns
    type: grafana-mqtt-datasource
    access: proxy
    isDefault: false
    editable: true
    jsonData:
      uri: "tcp://mosquitto-uns:1883"
