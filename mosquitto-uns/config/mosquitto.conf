# Mosquitto Central UNS Broker Configuration (Level 3.5 IT DMZ)
# Dual listeners: standard TCP MQTT (1883) and WebSocket MQTT (8000)

listener 1883
allow_anonymous true

listener 8000
protocol websockets
allow_anonymous true

# Persistence & Store-and-Forward Queuing
persistence true
persistence_location /mosquitto/data/
autosave_interval 60
max_queued_messages 50000
persistent_client_expiration 7d

# Logging configuration for UNS Inspector & Event Audit
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%d %H:%M:%S
