listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
autosave_interval 60
max_queued_messages 50000
persistent_client_expiration 7d

# Native OT-to-DMZ Bridge (Edge Mosquitto -> Mosquitto Central UNS)
connection edge-to-uns
address mosquitto-uns:1883
remote_clientid edge-to-uns
topic enterprise/# out 1
cleansession false
try_private false
notifications false
bridge_protocol_version mqttv311
bridge_attempt_unsubscribe false
restart_timeout 2 10
